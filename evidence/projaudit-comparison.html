<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audit Suite before and after</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      color: #f2f5f1;
      background: #080a0a;
      font-family: "Cascadia Mono", Consolas, monospace;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin: 0 0 18px;
      padding: 0 0 16px;
      border-bottom: 1px solid rgba(242, 245, 241, 0.22);
    }
    h1 { margin: 0; font-size: 28px; }
    p { margin: 0; color: #9ca7a2; font-size: 14px; }
    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    figure {
      min-width: 0;
      margin: 0;
      border: 1px solid rgba(242, 245, 241, 0.22);
      background: #0b0f0e;
    }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(242, 245, 241, 0.22);
      color: #55e6df;
      font-size: 15px;
      text-transform: uppercase;
    }
    figcaption span { color: #9ca7a2; font-size: 12px; }
    img {
      display: block;
      width: 100%;
      height: 1760px;
      object-fit: cover;
      object-position: top;
    }
  </style>
</head>
<body>
  <header>
    <h1>/projaudit Audit Suite — before / after</h1>
    <p>Validator website · browser-verified local staging contract</p>
  </header>
  <main>
    <figure>
      <figcaption>Before <span>Validator trust surface</span></figcaption>
      <img src="projaudit-before.png" alt="Validator website before the Audit Suite was added">
    </figure>
    <figure>
      <figcaption>After <span>Successful placeholder response</span></figcaption>
      <img src="projaudit-after.png" alt="Validator website after the Audit Suite was added and submitted successfully">
    </figure>
  </main>
</body>
</html>
